<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="t d">
  <title id="t">Bernardo Ávila — Backend developer</title>
  <desc id="d">Animation: several concurrent requests queue at a lock; exactly one passes through and is created.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="189" rx="10" fill="url(#bg)" stroke="#21262d"/>

  <!-- animated accent line along the top edge -->
  <rect x="40" y="0.5" width="300" height="1.5" fill="url(#accent)">
    <animate attributeName="x" values="-260;880" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- identity -->
  <text x="44" y="74" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.4">Bernardo Ávila</text>
  <text x="46" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Backend developer · Azores, Portugal</text>
  <text x="46" y="134" fill="#58a6ff" fill-opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6">Java · Spring Boot · PostgreSQL</text>

  <!-- ── concurrency vignette ── -->
  <g>
    <!-- flow lane -->
    <line x1="528" y1="95" x2="812" y2="95" stroke="#21262d" stroke-width="1"/>

    <!-- gate, opens once per cycle -->
    <rect x="706" y="46" width="3" height="46" rx="1.5" fill="#30363d">
      <animate attributeName="y" values="46;46;38;38;46;46" keyTimes="0;0.34;0.40;0.60;0.66;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="706" y="98" width="3" height="46" rx="1.5" fill="#30363d">
      <animate attributeName="y" values="98;98;106;106;98;98" keyTimes="0;0.34;0.40;0.60;0.66;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- losing requests -->
    <circle cy="60" r="4.5" fill="#484f58">
      <animate attributeName="cx" values="536;536;684;684;536" keyTimes="0;0.05;0.29;0.93;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.28;0.28;0" keyTimes="0;0.04;0.52;0.58;0.90;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="78" r="4.5" fill="#484f58">
      <animate attributeName="cx" values="536;536;684;684;536" keyTimes="0;0.05;0.31;0.93;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.28;0.28;0" keyTimes="0;0.04;0.52;0.58;0.90;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="112" r="4.5" fill="#484f58">
      <animate attributeName="cx" values="536;536;684;684;536" keyTimes="0;0.05;0.33;0.93;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.28;0.28;0" keyTimes="0;0.04;0.52;0.58;0.90;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="130" r="4.5" fill="#484f58">
      <animate attributeName="cx" values="536;536;684;684;536" keyTimes="0;0.05;0.35;0.93;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.28;0.28;0" keyTimes="0;0.04;0.52;0.58;0.90;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- 409 for the ones that lost -->
    <text x="598" y="156" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0">
      409 Conflict
      <animate attributeName="opacity" values="0;0;0.75;0.75;0;0" keyTimes="0;0.56;0.62;0.86;0.92;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- the one that wins -->
    <circle cy="95" r="5" fill="#58a6ff">
      <animate attributeName="cx" values="536;536;684;684;790;790;536" keyTimes="0;0.05;0.27;0.40;0.54;0.92;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.86;0.90;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#58a6ff;#58a6ff;#3fb950;#3fb950" keyTimes="0;0.46;0.58;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- 201 for the winner -->
    <text x="748" y="80" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0">
      201 Created
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.56;0.62;0.84;0.90;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
