<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="t d">
  <title id="t">Bernardo Ávila — Backend developer</title>
  <desc id="d">Animation: a request travels through the api, the service layer and the database, and returns as 200 OK.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="189" rx="10" fill="url(#bg)" stroke="#21262d"/>

  <rect x="40" y="0.5" width="300" height="1.5" fill="url(#accent)">
    <animate attributeName="x" values="-260;880" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- identity -->
  <text x="44" y="74" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.4">Bernardo Ávila</text>
  <text x="46" y="104" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Backend developer · Azores, Portugal</text>
  <text x="46" y="134" fill="#58a6ff" fill-opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6">Java · Spring Boot · PostgreSQL</text>

  <!-- ── request path ── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <line x1="498" y1="95" x2="822" y2="95" stroke="#21262d" stroke-width="1"/>

    <!-- pulse rings -->
    <circle cx="560" cy="95" r="7" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="7;7;20;20" keyTimes="0;0.14;0.27;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0;0" keyTimes="0;0.14;0.27;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="95" r="7" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0">
      <animate attributeName="r" values="7;7;20;20" keyTimes="0;0.30;0.43;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0;0" keyTimes="0;0.30;0.43;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="95" r="7" fill="none" stroke="#3fb950" stroke-width="1" opacity="0">
      <animate attributeName="r" values="7;7;20;20" keyTimes="0;0.46;0.59;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0;0" keyTimes="0;0.46;0.59;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- nodes -->
    <circle cx="560" cy="95" r="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d;#30363d" keyTimes="0;0.12;0.16;0.26;0.32;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="95" r="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d;#30363d" keyTimes="0;0.28;0.32;0.42;0.48;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="95" r="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="stroke" values="#30363d;#30363d;#3fb950;#3fb950;#30363d;#30363d" keyTimes="0;0.44;0.48;0.58;0.64;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text x="560" y="126" text-anchor="middle" fill="#6e7681" font-size="10.5" letter-spacing="0.4">api</text>
    <text x="660" y="126" text-anchor="middle" fill="#6e7681" font-size="10.5" letter-spacing="0.4">service</text>
    <text x="760" y="126" text-anchor="middle" fill="#6e7681" font-size="10.5" letter-spacing="0.4">db</text>

    <!-- the request -->
    <circle cy="95" r="4.5" fill="#58a6ff">
      <animate attributeName="cx" values="505;505;560;560;660;660;760;760;505;505" keyTimes="0;0.04;0.14;0.20;0.30;0.36;0.46;0.56;0.74;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.80;0.86;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#58a6ff;#58a6ff;#3fb950;#3fb950" keyTimes="0;0.50;0.58;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text x="660" y="64" text-anchor="middle" fill="#3fb950" font-size="11" opacity="0">
      200 OK
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.58;0.64;0.78;0.84;1" dur="6s" repeatCount="indefinite"/>
    </text>

  </g>
</svg>

